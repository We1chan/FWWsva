upstream websocket_backend {
    server 127.0.0.1:9114;
}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/SVA-web/dist/;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /alarm/ {
        alias /var/www/SVA-web/upload/alarm/;
    }

    location /zlm/ {
        alias /var/www/SVA-web/upload/storage/;
    }

    location /prod-api/ {
        proxy_pass http://127.0.0.1:9114/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Browser-facing proxy for ZLMediaKit HTTP-FLV / WebSocket-FLV. Keeping
    # media on the same public port also works when WSL service ports are not
    # forwarded directly to Windows or to another LAN client.
    location /media/ {
        proxy_pass http://127.0.0.1:9992/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Current frontends normalize local algorithm FLV URLs to /live/.
    # Preserve that path when forwarding to the primary ZLM instance.
    location /live/ {
        proxy_pass http://127.0.0.1:9992;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Analyzer publishes boxed output under app=analyzer on the primary ZLM.
    # Without this explicit prefix nginx's SPA fallback returns index.html to
    # flv.js, which is reported as "Non-FLV" by every screen-wall tile.
    location /analyzer/ {
        proxy_pass http://127.0.0.1:9992;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    # Browser-facing proxy for the dedicated GB28181 ZLMediaKit instance.
    # Keep it separate from /media/ because both ZLM processes use the same
    # app/stream namespaces on different local ports.
    location /gb-media/ {
        proxy_pass http://127.0.0.1:9996/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /websocket/ {
        proxy_pass http://websocket_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
